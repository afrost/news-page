<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2f2ef">
<meta name="referrer" content="no-referrer">
<title>My Rabbit Hole</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23000'/%3E%3Crect x='2' y='2' width='4' height='4' fill='%23f2f2ef'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2f2ef;        /* slightly light grey, easy on the eyes */
    --ink: #000000;
    --text: #1a1a1a;
    --muted: #5a5a57;
    --hair: #d3d3cd;
    --wash: #e6e6e1;

    --blue: #2447c9;
    --green: #157a4b;
    --orange: #d9481c;
    --purple: #6a3fc0;
    --gold: #a35f00;
    --pink: #b3266f;

    --lesson-bg: #f9efc4;
    --s: 4px; /* one "pixel" for corners and rules */
    --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: var(--serif);
    font-size: 1.125rem;
    line-height: 1.65;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  .wrap {
    max-width: 40rem;
    margin: 0 auto;
    padding: 0 1.25rem 4rem;
  }

  a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* Stepped "pixel" corners, used on images and panels */
  .pixel-frame {
    clip-path: polygon(
      0 calc(var(--s) * 2), var(--s) calc(var(--s) * 2), var(--s) var(--s), calc(var(--s) * 2) var(--s), calc(var(--s) * 2) 0,
      calc(100% - var(--s) * 2) 0, calc(100% - var(--s) * 2) var(--s), calc(100% - var(--s)) var(--s), calc(100% - var(--s)) calc(var(--s) * 2), 100% calc(var(--s) * 2),
      100% calc(100% - var(--s) * 2), calc(100% - var(--s)) calc(100% - var(--s) * 2), calc(100% - var(--s)) calc(100% - var(--s)), calc(100% - var(--s) * 2) calc(100% - var(--s)), calc(100% - var(--s) * 2) 100%,
      calc(var(--s) * 2) 100%, calc(var(--s) * 2) calc(100% - var(--s)), var(--s) calc(100% - var(--s)), var(--s) calc(100% - var(--s) * 2), 0 calc(100% - var(--s) * 2)
    );
  }

  /* Masthead */
  .masthead { padding-top: 2.25rem; }

  .masthead h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2.3rem, 10vw, 4.5rem);
    line-height: 1.05;
    letter-spacing: -0.035em;
    color: var(--ink);
  }

  /* The cursor blinks a few times on load, then rests */
  .masthead h1::after {
    content: "";
    display: inline-block;
    width: 0.3em;
    height: 0.66em;
    margin-left: 0.14em;
    background: var(--orange);
    animation: blink 0.9s steps(1) 4;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .dates { margin: 1rem 0 0; line-height: 1.4; }
  .dates .date-en { display: block; color: var(--text); font-size: 1.05rem; letter-spacing: 0.02em; }
  .dates .date-fr { display: block; color: var(--muted); font-style: italic; font-size: 1.05rem; }

  .pixel-rule {
    height: var(--s);
    margin: 1.5rem 0 2rem;
    background: repeating-linear-gradient(90deg,
      var(--blue) 0 4px, transparent 4px 8px,
      var(--green) 8px 12px, transparent 12px 16px,
      var(--orange) 16px 20px, transparent 20px 24px,
      var(--purple) 24px 28px, transparent 28px 32px);
  }

  /* Notices */
  .notice {
    margin: 0 0 2rem;
    padding: 0.75rem 1rem;
    background: var(--wash);
    color: var(--text);
    font-size: 1rem;
    line-height: 1.5;
  }

  /* Lesson: vocabulary of the day */
  .lesson {
    margin: 0 0 3rem;
    padding: 1.25rem 1.25rem 1.5rem;
    background: var(--lesson-bg);
  }
  .lesson h2 {
    margin: 0 0 0.3rem;
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.55rem;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .lesson h3 { margin: 0 0 0.9rem; font-family: var(--display); font-size: 1.05rem; font-weight: 500; color: var(--text); line-height: 1.4; }
  .lesson p { margin: 0 0 1rem; }

  .words { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.9rem; }
  .word {
    --wc: var(--blue);
    padding: 0.85rem 1rem 1rem;
    background: rgba(255, 255, 255, 0.6);
    border-left: 4px solid var(--wc);
  }
  .word:nth-child(4n+2) { --wc: var(--green); }
  .word:nth-child(4n+3) { --wc: var(--orange); }
  .word:nth-child(4n+4) { --wc: var(--purple); }
  .word p { margin: 0; }
  .word-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.15rem 0.75rem; }
  .word-fr { font-family: var(--display); font-weight: 700; font-size: 1.4rem; line-height: 1.25; letter-spacing: -0.01em; color: var(--ink); }
  .word-type { font-family: var(--display); font-weight: 500; font-size: 0.75rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--wc); }
  .word-en { margin-top: 0.15rem; font-size: 1.08rem; color: var(--ink); }
  .word-ex { margin-top: 0.6rem; font-weight: 600; color: var(--ink); line-height: 1.5; }
  .word-ex-en { color: var(--muted); font-style: italic; font-size: 1rem; line-height: 1.5; }
  .word-note { margin-top: 0.45rem; font-size: 0.95rem; color: var(--muted); }

  /* Stories */
  .story { --accent: var(--blue); }
  .story.sec-tech    { --accent: var(--blue); }
  .story.sec-env     { --accent: var(--green); }
  .story.sec-world   { --accent: var(--orange); }
  .story.sec-design  { --accent: var(--purple); }
  .story.sec-econ    { --accent: var(--gold); }
  .story.sec-culture { --accent: var(--pink); }

  .story + .story {
    margin-top: 2.75rem;
    padding-top: 2.75rem;
    border-top: 1px solid var(--hair);
  }

  .photo { margin: 0 0 0.6rem; }
  .photo-frame { aspect-ratio: 16 / 9; background: var(--wash); overflow: hidden; }
  .photo-frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .photo figcaption { margin-top: 0.4rem; color: var(--muted); font-size: 0.85rem; line-height: 1.3; }

  .story-title {
    margin: 0 0 0.7rem;
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.7rem;
    line-height: 1.18;
    letter-spacing: -0.022em;
    color: var(--ink);
    text-wrap: balance;
  }
  .photo + .story-title { margin-top: 1.1rem; }
  .story--lead .story-title { font-size: 2.1rem; line-height: 1.12; font-weight: 700; letter-spacing: -0.028em; }

  .dek { margin: 0 0 0.9rem; font-size: 1.22rem; line-height: 1.45; font-style: italic; color: var(--text); }

  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.75rem; margin: 0 0 1.4rem; font-size: 0.95rem; color: var(--muted); }
  .meta .section {
    font-family: var(--display);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .meta .source::before {
    content: "";
    display: inline-block;
    width: var(--s);
    height: var(--s);
    margin-right: 0.75rem;
    vertical-align: middle;
    background: var(--accent);
  }
  .meta .section:empty + .source::before { display: none; }

  .body p { margin: 0 0 1.1em; max-width: 36rem; }
  .original { margin: 0.25rem 0 1.5rem; font-size: 0.95rem; color: var(--muted); }
  .original a { text-decoration-color: var(--accent); text-decoration-thickness: 2px; }

  /* French version */
  .fr-brief { background: #e4e6ef; background: color-mix(in srgb, var(--accent) 11%, var(--paper)); }
  .fr-brief summary {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    padding: 0.9rem 1.1rem;
    cursor: pointer;
    list-style: none;
    font-family: var(--display);
    font-weight: 500;
    font-size: 1.05rem;
    line-height: 1.3;
    color: var(--ink);
  }
  .fr-brief summary::-webkit-details-marker { display: none; }
  .fr-brief summary::after { content: "+"; margin-left: auto; font-size: 1.6rem; line-height: 1; color: var(--accent); }
  .fr-brief[open] summary::after { content: "\2212"; }
  .fr-brief .level { color: var(--muted); font-family: var(--serif); font-weight: 400; font-size: 0.95rem; }
  .fr-body { padding: 0 1.1rem 1.25rem; }
  .fr-body h3 { margin: 0 0 0.7rem; font-family: var(--display); font-weight: 600; font-size: 1.25rem; line-height: 1.25; letter-spacing: -0.015em; color: var(--ink); }
  .fr-body p { margin: 0 0 1.1em; max-width: 36rem; }
  .vocab { margin: 1.5rem 0 0; padding-top: 1.25rem; border-top: 1px solid var(--hair); display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 0.6rem 1.25rem; }
  .vocab div { min-width: 0; }
  .vocab dt { color: var(--ink); font-weight: 600; }
  .vocab dd { margin: 0; color: var(--muted); font-style: italic; font-size: 1rem; }

  .foot { margin-top: 3.5rem; color: var(--muted); font-size: 0.9rem; }

  @media (min-width: 720px) {
    body { font-size: 1.1875rem; }
    .story-title { font-size: 1.9rem; }
    .story--lead .story-title { font-size: 2.6rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .masthead h1::after { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1 id="site-title">My Rabbit Hole</h1>
    <p class="dates"><span class="date-en" id="date-en"></span><span class="date-fr" id="date-fr" lang="fr"></span></p>
  </header>
  <div class="pixel-rule" aria-hidden="true"></div>

  <main id="main" aria-live="polite">
    <p class="notice">Loading today's edition.</p>
  </main>

  <footer class="foot" id="foot"></footer>
</div>

<script>
(function () {
  "use strict";

  var DATA_URL = "data/latest.json";
  var main = document.getElementById("main");

  /* ---------- helpers (everything is built with textContent, never innerHTML) ---------- */

  function el(tag, attrs) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else node.setAttribute(k, v === true ? "" : v);
      });
    }
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid === null || kid === undefined) continue;
      node.append(kid);
    }
    return node;
  }

  function safeUrl(u) {
    try {
      var url = new URL(u);
      return (url.protocol === "https:" || url.protocol === "http:") ? url.href : "";
    } catch (e) { return ""; }
  }

  function paragraphs(v) {
    if (Array.isArray(v)) return v.filter(Boolean).map(String);
    if (typeof v === "string") return v.split(/\n{2,}/).map(function (s) { return s.trim(); }).filter(Boolean);
    return [];
  }

  function parseDay(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date();
  }

  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  /* Each section gets its own accent colour */
  function sectionClass(name) {
    var s = String(name || "").toLowerCase();
    if (/tech|science|ai\b/.test(s)) return "sec-tech";
    if (/environ|climate|nature/.test(s)) return "sec-env";
    if (/design|architect/.test(s)) return "sec-design";
    if (/econom|business|financ|market/.test(s)) return "sec-econ";
    if (/cultur|art|book|film|music/.test(s)) return "sec-culture";
    if (/world|politic|europe|africa|asia|america/.test(s)) return "sec-world";
    return "";
  }

  /* ---------- renderers ---------- */

  /* A story with no image shows no picture area at all */
  function renderPhoto(story) {
    var src = safeUrl(story.image);
    if (!src) return null;
    var img = el("img", { src: src, alt: story.image_alt || "", loading: "lazy", decoding: "async" });
    var fig = el("figure", { class: "photo" }, el("div", { class: "photo-frame pixel-frame" }, img));
    img.addEventListener("error", function () { fig.remove(); });
    if (story.image_credit) fig.append(el("figcaption", { text: story.image_credit }));
    return fig;
  }

  function renderFrench(fr) {
    if (!fr) return null;
    var body = el("div", { class: "fr-body", lang: "fr" });
    if (fr.headline) body.append(el("h3", { text: fr.headline }));
    /* "body" is the full-length French text; "summary" is still accepted for older editions */
    paragraphs(fr.body || fr.summary).forEach(function (p) { body.append(el("p", { text: p })); });
    if (Array.isArray(fr.vocab) && fr.vocab.length) {
      var dl = el("dl", { class: "vocab" });
      fr.vocab.forEach(function (w) {
        dl.append(el("div", null, el("dt", { text: w.fr }), el("dd", { lang: "en", text: w.en })));
      });
      body.append(dl);
    }
    return el("details", { class: "fr-brief pixel-frame" },
      el("summary", null,
        el("span", { text: "Lire en français" }),
        fr.level === "" ? null : el("span", { class: "level", text: fr.level || "A2-B1" })),
      body);
  }

  function renderStory(story, index) {
    var cls = "story" + (index === 0 ? " story--lead" : "");
    var sc = sectionClass(story.section);
    if (sc) cls += " " + sc;
    var art = el("article", { class: cls });

    var photo = renderPhoto(story);
    if (photo) art.append(photo);
    art.append(el("h2", { class: "story-title", text: story.headline || "Untitled" }));
    if (story.dek) art.append(el("p", { class: "dek", text: story.dek }));

    var meta = el("p", { class: "meta" });
    if (story.section) meta.append(el("span", { class: "section", text: story.section }));
    if (story.source) meta.append(el("span", { class: "source", text: story.source }));
    if (meta.children.length) art.append(meta);

    var body = el("div", { class: "body" });
    paragraphs(story.body).forEach(function (p) { body.append(el("p", { text: p })); });
    art.append(body);

    var link = safeUrl(story.url);
    if (link) {
      art.append(el("p", { class: "original" },
        el("a", { href: link, target: "_blank", rel: "noopener noreferrer", text: "Read the original" + (story.source ? " at " + story.source : "") })));
    }

    var fr = renderFrench(story.french);
    if (fr) art.append(fr);
    return art;
  }

  function renderLesson(lesson) {
    if (!lesson) return null;
    var sec = el("section", { class: "lesson pixel-frame", "aria-labelledby": "lesson-title" });
    sec.append(el("h2", { id: "lesson-title", lang: "fr", text: "Leçon du jour" }));
    if (lesson.title) sec.append(el("h3", { lang: "fr", text: lesson.title }));
    paragraphs(lesson.intro).forEach(function (p) { sec.append(el("p", { text: p })); });

    if (Array.isArray(lesson.words) && lesson.words.length) {
      var list = el("ul", { class: "words" });
      lesson.words.forEach(function (w) {
        if (!w || !w.fr) return;
        var item = el("li", { class: "word" });
        item.append(el("p", { class: "word-head" },
          el("span", { class: "word-fr", lang: "fr", text: w.fr }),
          w.type ? el("span", { class: "word-type", text: w.type }) : null));
        if (w.en) item.append(el("p", { class: "word-en", text: w.en }));
        if (w.example_fr) item.append(el("p", { class: "word-ex", lang: "fr", text: w.example_fr }));
        if (w.example_en) item.append(el("p", { class: "word-ex-en", text: w.example_en }));
        if (w.note) item.append(el("p", { class: "word-note", text: w.note }));
        list.append(item);
      });
      sec.append(list);
    }
    return sec;
  }

  function render(data) {
    var day = parseDay(data.date);

    if (data.site_title) {
      document.getElementById("site-title").textContent = data.site_title;
      document.title = data.site_title;
    }
    document.getElementById("date-en").textContent =
      new Intl.DateTimeFormat("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(day);
    document.getElementById("date-fr").textContent =
      new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" }).format(day);

    main.textContent = "";

    if (data.sample) {
      main.append(el("p", { class: "notice", text: "This is sample content so you can check the layout. The daily edition replaces it." }));
    } else if (!sameDay(day, new Date())) {
      main.append(el("p", { class: "notice", text: "Today's edition isn't ready yet. You're reading the edition from " +
        new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "long" }).format(day) + "." }));
    }

    var lesson = renderLesson(data.lesson);
    if (lesson) main.append(lesson);

    var stories = Array.isArray(data.stories) ? data.stories : [];
    if (!stories.length) {
      main.append(el("p", { class: "notice", text: "This edition has no stories. Check that data/latest.json has a \"stories\" list." }));
    }
    stories.forEach(function (s, i) { main.append(renderStory(s, i)); });

    if (data.generated_at) {
      var t = new Date(data.generated_at);
      if (!isNaN(t)) {
        document.getElementById("foot").textContent = "Edition written " +
          new Intl.DateTimeFormat("en-GB", { dateStyle: "medium", timeStyle: "short" }).format(t) + ".";
      }
    }
  }

  function fail(message) {
    main.textContent = "";
    main.append(el("p", { class: "notice", text: message }));
  }

  fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) {
        throw new Error("The server answered " + res.status + " for " + DATA_URL + ". The file is missing or in the wrong folder. Folder and file names are case-sensitive on GitHub Pages.");
      }
      return res.json().catch(function () {
        throw new Error(DATA_URL + " was found but isn't valid JSON. Paste it into a JSON validator to find the broken line.");
      });
    })
    .then(function (data) {
      try { render(data); }
      catch (e) {
        throw new Error("The data loaded but a story couldn't be displayed (" + e.message + "). Check that every story has the fields listed in rabbit-hole-news.md.");
      }
    })
    .catch(function (err) {
      if (location.protocol === "file:") {
        fail("This page can't load its data when opened straight from disk. Open your GitHub Pages address instead, or serve the folder locally.");
      } else if (err instanceof TypeError) {
        fail("Couldn't reach " + DATA_URL + ". Check your connection and reload.");
      } else {
        fail((err && err.message) || "Couldn't load " + DATA_URL + ".");
      }
    });
})();
</script>
</body>
</html>
